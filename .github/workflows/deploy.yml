# Publica na Vercel a cada merge em main, direto do GitHub (não depende da integração Git da Vercel).
# Requer o segredo VERCEL_TOKEN (Settings > Secrets and variables > Actions). Os IDs abaixo não são secretos.
name: Deploy produção

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-producao
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: team_KtShbotK9blWFngaRlWXXasj
  VERCEL_PROJECT_ID: prj_im9KyZyQ2mt1znt60577ZHWAhCVG

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm install --global vercel@latest
      - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
