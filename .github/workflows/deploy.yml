# Publicação manual na Vercel pelo GitHub (Actions › Deploy produção › Run workflow).
# O caminho normal é a própria Vercel publicar cada merge em main; este workflow é a alternativa se a integração Git falhar.
# Requer o segredo VERCEL_TOKEN (Settings > Secrets and variables > Actions); sem ele, o job termina avisando, sem erro.
name: Deploy produção

on:
  workflow_dispatch:

concurrency:
  group: deploy-producao
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: team_KtShbotK9blWFngaRlWXXasj
  VERCEL_PROJECT_ID: prj_im9KyZyQ2mt1znt60577ZHWAhCVG
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Conferir o segredo VERCEL_TOKEN
        if: env.VERCEL_TOKEN == ''
        run: echo "::notice::Segredo VERCEL_TOKEN não configurado; nada foi publicado. A Vercel continua publicando cada merge em main."
      - uses: actions/checkout@v4
        if: env.VERCEL_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.VERCEL_TOKEN != ''
        with:
          node-version: 22
          cache: npm
      - if: env.VERCEL_TOKEN != ''
        run: npm ci
      - if: env.VERCEL_TOKEN != ''
        run: npm test
      - if: env.VERCEL_TOKEN != ''
        run: npm install --global vercel@latest
      - if: env.VERCEL_TOKEN != ''
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - if: env.VERCEL_TOKEN != ''
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - if: env.VERCEL_TOKEN != ''
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
